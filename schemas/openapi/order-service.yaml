openapi: 3.1.0
info:
  title: Order Service API
  version: 1.0.0
  description: |
    Example bounded context "order" of the PaaS template. The OpenAPI document is the
    contract of record (guideline §6): TypeScript types, request validation and contract
    tests are generated from it. Breaking changes require a new major version path.
  x-paas-service: order-service
  x-paas-owner: order-team
servers:
  - url: https://{domain}/v1
    variables:
      domain:
        default: api.sandbox.example.com
security:
  - tenantJwt: []
tags:
  - name: orders
paths:
  /orders:
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create an order (idempotent)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/RequestDeadline'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
            x-correlation-id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '200':
          description: Idempotent replay of a previously created order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/DeadlineExceeded'
    get:
      operationId: listOrders
      tags: [orders]
      summary: List orders of the caller's tenant (cursor pagination)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 1024
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Page of orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /orders/{orderId}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get one order of the caller's tenant
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/OrderId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    tenantJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT issued by the platform IdP. MUST carry `custom:tenantId` and `custom:tenantTier`.
        The tenant is never taken from request content.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated key, unique per (tenant, operation). 8..128 URL-safe chars.
      schema:
        type: string
        pattern: '^[A-Za-z0-9._:-]{8,128}$'
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Business-flow correlation id; generated by the API when absent or invalid.
      schema:
        type: string
        pattern: '^[A-Za-z0-9._:=-]{8,128}$'
    RequestDeadline:
      name: X-Request-Deadline
      in: header
      required: false
      description: Absolute epoch-millisecond deadline propagated to downstream calls.
      schema:
        type: string
        pattern: '^[0-9]{13}$'
  headers:
    XRequestId:
      schema:
        type: string
    XCorrelationId:
      schema:
        type: string
  schemas:
    OrderId:
      type: string
      pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
      description: ULID
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: integer
          minimum: 0
          description: Minor units (e.g. yen, cents)
        currency:
          type: string
          minLength: 3
          maxLength: 3
    OrderLine:
      type: object
      required: [sku, quantity, unitPrice]
      properties:
        sku:
          type: string
          minLength: 1
          maxLength: 64
        quantity:
          type: integer
          minimum: 1
          maximum: 10000
        unitPrice:
          $ref: '#/components/schemas/Money'
    CreateOrderRequest:
      type: object
      required: [customerRef, lines]
      additionalProperties: false
      properties:
        customerRef:
          type: string
          minLength: 1
          maxLength: 128
        lines:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: '#/components/schemas/OrderLine'
        note:
          type: string
          maxLength: 1000
    OrderStatus:
      type: string
      enum: [CREATED, FULFILLED, FAILED]
    Order:
      type: object
      required: [orderId, status, customerRef, lines, total, createdAt, updatedAt]
      properties:
        orderId:
          $ref: '#/components/schemas/OrderId'
        status:
          $ref: '#/components/schemas/OrderStatus'
        customerRef:
          type: string
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
        total:
          $ref: '#/components/schemas/Money'
        note:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OrderPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        nextCursor:
          type: string
          description: Opaque cursor; absent on the last page.
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId, retryable]
          properties:
            code:
              type: string
              description: Stable machine-readable code (see ErrorCode enum in @paas/api-contracts)
            message:
              type: string
            requestId:
              type: string
            correlationId:
              type: string
            retryable:
              type: boolean
            details:
              type: array
              items:
                type: object
                properties:
                  path:
                    type: string
                  message:
                    type: string
  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated but not permitted for this tenant/resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found in the caller's tenant (never discloses other tenants)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Idempotency key reused with a different payload, or state conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Tenant/tier rate limit exceeded; honour Retry-After
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected fault; safe to retry with the same Idempotency-Key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    DeadlineExceeded:
      description: The request deadline budget was exhausted before completion
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
