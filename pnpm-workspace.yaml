packages:
  - apps/*
  - packages/*
  - tools/*
  - tests
allowBuilds:
  esbuild: true
# pnpm 11 minimum-release-age policy: turbo 2.11.9 was published less than 24h before the
# initial resolution. Remove these exclusions once the package is older than the cutoff.
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.9'
  - '@turbo/darwin-arm64@2.11.9'
  - '@turbo/linux-64@2.11.9'
  - '@turbo/linux-arm64@2.11.9'
  - '@turbo/windows-64@2.11.9'
  - '@turbo/windows-arm64@2.11.9'
  - turbo@2.11.9
